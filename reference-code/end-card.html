<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TODOOM end card</title>
<style>
  /* HQ design system, dark: monochrome, monospace, square corners, uppercase spaced labels. */
  @font-face { font-family: departureMono; src: url(departure-mono.woff2) format("woff2"); }
  :root { --fg: hsl(0 0% 95%); --bg: hsl(0 0% 8%); --muted: hsl(0 0% 60%); --line: hsl(0 0% 95% / .14); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 360px; height: 640px; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: departureMono, ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
  /* Content sits between Instagram's top bar and its caption/buttons at the bottom. */
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 166px; }
  .frame { width: 272px; border: 2px solid var(--fg); display: flex; flex-direction: column; align-items: center; }
  .body { display: flex; flex-direction: column; align-items: center; padding: 34px 0 32px; }
  .icon { width: 88px; height: 88px; display: block; }
  .word { margin-top: 22px; font-size: 44px; line-height: 1; letter-spacing: .06em; padding-left: .06em; height: 44px; }
  .rule { width: 208px; height: 1px; background: var(--line); margin: 22px 0 18px; }
  .tag { font-size: 10px; letter-spacing: .2em; padding-left: .2em; text-transform: uppercase; }
  .made { position: absolute; top: 478px; left: 0; right: 0; text-align: center; font-size: 9px; letter-spacing: .2em; color: var(--muted); }
  .made b { font-weight: 400; color: var(--fg); }
  /* the untyped letters hold their space, so the name never shifts while it types */
  .cur { position: relative; }
  #rest { visibility: hidden; }
  .cursor { position: absolute; left: 0; top: -.85em; display: block; width: .5em; height: .9em; background: var(--fg); }
  [data-o] { opacity: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame" data-o="frame">
    <div class="body">
      <img class="icon" src="icon.svg" alt="" data-o="icon">
      <div class="word"><span id="word"></span><span class="cur"><span class="cursor" id="cursor"></span></span><span id="rest"></span></div>
      <div class="rule" data-o="rule"></div>
      <div class="tag" data-o="tag">All your doom in one place</div>
    </div>
  </div>
</div>
<div class="made" data-o="made">[ MADE WITH <b>STUDIO</b> ]</div>
<script>
  // render(t): draw the card at t seconds. Frames are captured one at a time, so this is
  // pure state, no timers. With no ?t the card shows its final state.
  const WORD = "TODOOM";
  const clamp = x => Math.max(0, Math.min(1, x));
  const fade = (t, start, dur) => clamp((t - start) / dur);
  function render(t) {
    const o = (name, v) => document.querySelector(`[data-o="${name}"]`).style.opacity = v;
    o("frame", fade(t, 0, 0.25));
    o("icon", fade(t, 0.2, 0.3));
    const typed = Math.floor(clamp((t - 0.5) / 0.6) * WORD.length);
    document.getElementById("word").textContent = WORD.slice(0, typed);
    document.getElementById("rest").textContent = WORD.slice(typed);
    // the cursor blinks while typing, then goes away once the tagline lands
    document.getElementById("cursor").style.visibility = t < 0.5 || t > 1.7 ? "hidden" : (Math.floor(t * 4) % 2 ? "hidden" : "visible");
    o("rule", fade(t, 1.2, 0.3));
    o("tag", fade(t, 1.3, 0.35));
    o("made", fade(t, 1.8, 0.4));
  }
  window.render = render;
  render(Number(new URLSearchParams(location.search).get("t") ?? 99));
</script>
</body>
</html>
